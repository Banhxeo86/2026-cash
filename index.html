<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>동전 던지기 실험</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 추가적인 폰트 스타일링 (둥글고 귀여운 느낌) */
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
        
        body {
            font-family: 'Jua', sans-serif; /* 아이들에게 친숙한 Jua 폰트 사용 */
            background-color: #FEF3C7; /* 밝은 노란색 바탕 (bg-yellow-100) */
        }
        
        .bar-transition {
            transition: height 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-10 px-4 text-gray-800">

    <!-- 제목 영역 -->
    <h1 class="text-5xl md:text-6xl text-blue-500 drop-shadow-md mb-6 text-center">
        🪙 동전 던지기 실험 🪙
    </h1>
    
    <div class="text-3xl md:text-4xl mb-10 text-gray-700 bg-white px-8 py-4 rounded-full shadow-md border-4 border-yellow-300">
        총 던진 횟수: <span id="total-count" class="text-red-500">0</span> 번
    </div>

    <!-- 버튼 영역 -->
    <div class="flex flex-wrap justify-center gap-4 mb-12 max-w-4xl">
        <button onclick="toss(1)" class="bg-sky-400 hover:bg-sky-500 text-white text-3xl py-4 px-8 rounded-2xl shadow-lg transform transition active:scale-95 border-b-4 border-sky-600">
            1번 던지기
        </button>
        <button onclick="toss(10)" class="bg-green-400 hover:bg-green-500 text-white text-3xl py-4 px-8 rounded-2xl shadow-lg transform transition active:scale-95 border-b-4 border-green-600">
            10번 던지기
        </button>
        <button onclick="toss(100)" class="bg-orange-400 hover:bg-orange-500 text-white text-3xl py-4 px-8 rounded-2xl shadow-lg transform transition active:scale-95 border-b-4 border-orange-600">
            100번 던지기
        </button>
        <button onclick="toss(1000)" class="bg-purple-400 hover:bg-purple-500 text-white text-3xl py-4 px-8 rounded-2xl shadow-lg transform transition active:scale-95 border-b-4 border-purple-600">
            1000번 던지기
        </button>
    </div>

    <!-- 결과 그래프 영역 -->
    <div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-2xl border-4 border-blue-200">
        <div class="flex justify-around items-end h-80 pt-10">
            
            <!-- 앞면 막대 -->
            <div class="flex flex-col items-center w-1/3">
                <div id="heads-percent" class="text-3xl text-gray-500 mb-2">0%</div>
                <div class="w-24 md:w-32 h-64 bg-gray-100 rounded-t-2xl relative overflow-hidden border-2 border-b-0 border-gray-200">
                    <div id="heads-bar" class="absolute bottom-0 w-full bg-blue-400 bar-transition flex items-end justify-center pb-2" style="height: 0%;">
                    </div>
                </div>
                <div class="text-4xl text-blue-600 mt-6">앞면</div>
                <div id="heads-count" class="text-2xl text-gray-600 mt-2">0번</div>
            </div>

            <!-- 뒷면 막대 -->
            <div class="flex flex-col items-center w-1/3">
                <div id="tails-percent" class="text-3xl text-gray-500 mb-2">0%</div>
                <div class="w-24 md:w-32 h-64 bg-gray-100 rounded-t-2xl relative overflow-hidden border-2 border-b-0 border-gray-200">
                    <div id="tails-bar" class="absolute bottom-0 w-full bg-pink-400 bar-transition flex items-end justify-center pb-2" style="height: 0%;">
                    </div>
                </div>
                <div class="text-4xl text-pink-600 mt-6">뒷면</div>
                <div id="tails-count" class="text-2xl text-gray-600 mt-2">0번</div>
            </div>
            
        </div>
        
        <!-- 초기화 버튼 -->
        <div class="flex justify-center mt-12">
            <button onclick="resetExperiment()" class="bg-gray-300 hover:bg-gray-400 text-gray-700 text-2xl py-3 px-8 rounded-full shadow transition active:scale-95">
                🔄 처음부터 다시하기
            </button>
        </div>
    </div>

    <script>
        let headsCount = 0;
        let tailsCount = 0;

        // 동전 던지기 함수
        function toss(times) {
            for (let i = 0; i < times; i++) {
                // 0.5 미만이면 앞면, 이상이면 뒷면
                if (Math.random() < 0.5) {
                    headsCount++;
                } else {
                    tailsCount++;
                }
            }
            updateUI();
        }

        // 결과 초기화 함수
        function resetExperiment() {
            headsCount = 0;
            tailsCount = 0;
            updateUI();
        }

        // 화면 업데이트 함수
        function updateUI() {
            const total = headsCount + tailsCount;
            
            // 총 던진 횟수 텍스트 업데이트
            document.getElementById('total-count').innerText = total.toLocaleString();
            
            // 각 횟수 텍스트 업데이트
            document.getElementById('heads-count').innerText = headsCount.toLocaleString() + '번';
            document.getElementById('tails-count').innerText = tailsCount.toLocaleString() + '번';

            if (total === 0) {
                // 0번일 때는 그래프와 퍼센트를 0으로 초기화
                document.getElementById('heads-percent').innerText = '0%';
                document.getElementById('tails-percent').innerText = '0%';
                document.getElementById('heads-bar').style.height = '0%';
                document.getElementById('tails-bar').style.height = '0%';
            } else {
                // 퍼센트 계산 (소수점 1자리까지)
                const headsPercent = ((headsCount / total) * 100).toFixed(1);
                const tailsPercent = ((tailsCount / total) * 100).toFixed(1);

                // 퍼센트 텍스트 업데이트
                document.getElementById('heads-percent').innerText = headsPercent + '%';
                document.getElementById('tails-percent').innerText = tailsPercent + '%';

                // 막대 그래프 높이 업데이트 (애니메이션 적용됨)
                document.getElementById('heads-bar').style.height = headsPercent + '%';
                document.getElementById('tails-bar').style.height = tailsPercent + '%';
            }
        }
    </script>
</body>
</html>
